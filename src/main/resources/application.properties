# =============================================================================
# Application Configuration
# Course: CS336B - Object Oriented Prog. Using Java (ODD SEM-2026-27)
# Scenario: Student Profile and Skill Development Management System
# =============================================================================
spring.application.name=Student Profile and Skill Development Management System
server.port=8080

# =============================================================================
# MySQL Database Connection Settings
# Configures HikariCP DataSource for Spring JdbcTemplate and Raw JDBC
# =============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/mse_java_exam_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Hardik@2006
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================================
# Automatic Database Initialization
# Executes schema.sql against MySQL on application startup to create tables
# =============================================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# =============================================================================
# Logging Configuration
# =============================================================================
logging.level.com.kiet.examproject=INFO
logging.level.org.springframework.jdbc.core=DEBUG
